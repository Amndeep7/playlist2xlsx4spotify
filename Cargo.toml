[package]
name = "playlist2xlsx4spotify"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.32"
itertools = "0.14.0"
rspotify = { version = "0.16.1", features = ["cli", "env-file"] }
rust_xlsxwriter = "0.95.0"
sanitise-file-name = "1.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
